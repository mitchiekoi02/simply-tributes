<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Simply Tributes</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css"/>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"/>

  <!-- PWA -->
  <meta name="theme-color" content="#d4af37">
  <link rel="manifest" href="manifest.json">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<!-- =========================
     HERO
========================= -->
<section id="hero">
  <div class="overlay"></div>

  <div class="hero-content">

    <img id="hero-image" alt="Hero image"/>

    <h1 id="hero-name"></h1>
    <h2 id="hero-degree"></h2>
    <h3 id="hero-school"></h3>
    <p id="hero-year"></p>
    <blockquote id="hero-quote"></blockquote>

    <button id="begin-btn">Begin Journey</button>

  </div>
</section>

<!-- =========================
     GALLERY
========================= -->
<section id="gallery-section">
  <h2>Memories</h2>
  <div id="gallery-grid"></div>
</section>

<!-- =========================
     MESSAGES + GUEST FORM
========================= -->
<section id="messages-section">

  <h2>Messages</h2>

  <!-- GUEST FORM -->
  <div class="guest-form">

    <h3>Leave a Message</h3>

    <input id="guest-name" type="text" placeholder="Your name" />

    <textarea id="guest-message" placeholder="Write your message..."></textarea>

    <input id="guest-photo" type="file" accept="image/*" />

    <button id="submit-message">Send Message ❤️</button>

  </div>

  <!-- MESSAGES -->
  <div id="messages-grid"></div>

</section>

<!-- =========================
     SHARE
========================= -->
<div class="share-container">
  <button onclick="shareFB()">Facebook</button>
  <button onclick="shareX()">X</button>
  <button onclick="shareWA()">WhatsApp</button>
  <button onclick="copyLink()">Copy Link</button>
</div>

<!-- =========================
     LIGHTBOX
========================= -->
<div id="lightbox" class="hidden">
  <img id="lightbox-img" alt="Preview image"/>
</div>

<!-- =========================
     MUSIC CONTROLS
========================= -->
<div id="music-control" class="hidden">
  <button id="music-toggle">🎵</button>
</div>

<!-- =========================
     MOBILE NAV (APP STYLE)
========================= -->
<div class="mobile-nav">
  <button onclick="scrollToSection('hero')">🏠</button>
  <button onclick="scrollToSection('gallery-section')">📸</button>
  <button onclick="scrollToSection('messages-section')">💬</button>
  <button onclick="navigator.share ? shareNative() : copyLink()">🔗</button>
</div>

<!-- =========================
     SCRIPT
========================= -->
<script src="js/script.js"></script>

</body>
</html>
