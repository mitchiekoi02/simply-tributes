<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simply Tributes</title>

  <link rel="stylesheet" href="css/style.css"/>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"/>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<section id="hero">
  <div class="overlay"></div>
  <div class="hero-content">

    <img id="hero-image" />

    <h1 id="hero-name"></h1>
    <h2 id="hero-degree"></h2>
    <h3 id="hero-school"></h3>
    <p id="hero-year"></p>
    <blockquote id="hero-quote"></blockquote>

    <button id="begin-btn">Begin Journey</button>

  </div>
</section>

<section id="gallery-section">
  <h2>Memories</h2>
  <div id="gallery-grid"></div>
</section>

<section id="messages-section">
  <h2>Messages</h2>
  <div id="messages-grid"></div>
</section>

<!-- SHARE -->
<div class="share-container">
  <button onclick="shareFB()">FB</button>
  <button onclick="shareX()">X</button>
  <button onclick="shareWA()">WA</button>
  <button onclick="copyLink()">Copy</button>
</div>

<div id="lightbox" class="hidden">
  <img id="lightbox-img"/>
</div>

<div id="music-control" class="hidden">
  <button id="music-toggle">🎵</button>
</div>

<script src="js/script.js"></script>

</body>
</html>
