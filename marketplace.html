<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Template Marketplace</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #1c1c1c;
      border-radius: 12px;
      overflow: hidden;
      padding: 10px;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    button {
      margin-top: 10px;
      width: 100%;
      padding: 10px;
      border: none;
      background: gold;
      cursor: pointer;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<h1>🎨 Template Marketplace</h1>

<div id="grid" class="grid"></div>

<script src="js/marketplace.js"></script>

</body>
</html>
